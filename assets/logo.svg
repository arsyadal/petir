<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="boltFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf4d"/>
      <stop offset="55%" stop-color="#ffab00"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>

  <!-- diamond frame, drawn first so the bolt can visually break through it -->
  <polygon points="200,26 374,200 200,374 26,200"
           fill="none" stroke="#0c0c0c" stroke-width="20" stroke-linejoin="round"/>

  <!-- bolt: black outline stroke underneath -->
  <path d="M 352,46 L 218,206 L 278,206 L 138,350"
        fill="none" stroke="#0c0c0c" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bolt: orange gradient fill stroke on top -->
  <path d="M 352,46 L 218,206 L 278,206 L 138,350"
        fill="none" stroke="url(#boltFill)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- shine sliver along the leading edge -->
  <path d="M 338,66 L 232,196"
        fill="none" stroke="#fff3c4" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M 264,220 L 154,336"
        fill="none" stroke="#fff3c4" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- shadow sliver along the trailing edge -->
  <path d="M 358,60 L 236,214"
        fill="none" stroke="#d9660a" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M 284,214 L 146,362"
        fill="none" stroke="#d9660a" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
</svg>
